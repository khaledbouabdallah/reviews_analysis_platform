
services:
  # MongoDB service
  mongodb:
    image: mongo:latest
    container_name: reviews_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    networks:
      - reviews_network

  # Scraper service - API mode
  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: reviews_scraper_api
    restart: always
    ports:
      - "8001:8001"  # API port
    depends_on:
      - mongodb
    volumes:
      - ./scraper/app:/app/app  # Map your code directory (for development)
    environment:
      - MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/reviews_db
      - PYTHONUNBUFFERED=1
    networks:
      - reviews_network
    shm_size: '2gb'
    mem_limit: 4g
    cpus: 2.0
    #command: api  # Run in API mode

  # Backend API service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reviews_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
      - scraper
    environment:
      - MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/reviews_db
      - SCRAPER_SERVICE_URL=http://scraper:8001
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/app:/app/app 
    networks:
      - reviews_network

  # Frontend (Streamlit) service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reviews_frontend
    restart: always
    ports:
      - "3000:3000"  # Only change the port
    depends_on:
      - backend
    environment:
      #- NEXT_PUBLIC_API_URL=http://backend:8000  # Keep internal container communication
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      #- /app/node_modules
      - /app/.next
    networks:
      - reviews_network

networks:
  reviews_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local