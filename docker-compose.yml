# WARNING: This setup is for local development only.
# DO NOT use these credentials in production.
services:
  # MongoDB service
  mongodb:
    image: mongo:latest
    container_name: reviews_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGODB_DB_NAME=mydatabase
    networks:
      - reviews_network

  redis:
    image: redis:7-alpine
    container_name: reviews_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - reviews_network

  # Backend API service - Development target
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development 
    container_name: reviews_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
      - redis
    environment:
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/reviews_local?authSource=admin
      - MONGODB_DB_NAME=reviews_local
      - REDIS_URL=redis://redis:6379/0 
      - SCRAPER_SERVICE_URL=http://scraper_worker:8080
      - GIMINI_API_KEY=${GIMINI_API_KEY}
      - GIMINI_MODEL_NAME=${GIMINI_MODEL_NAME}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/app:/app/app
    networks:
      - reviews_network

  # Scraper: Pure Celery Worker - Development target
  scraper_worker:
    build:
      context: ./scraper
      dockerfile: Dockerfile
      target: development 
    container_name: reviews_scraper_worker
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./scraper/app:/app/app
      - ./scraper/logs:/app/logs
    environment:
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/reviews_local?authSource=admin
      - MONGODB_DB_NAME=reviews_local
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    networks:
      - reviews_network
    shm_size: '2gb'
    mem_limit: 4g
    cpus: 2.0
  
  # Frontend Next.js - Development target
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development  
    container_name: reviews_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NODE_ENV=development  
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - reviews_network

networks:
  reviews_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local