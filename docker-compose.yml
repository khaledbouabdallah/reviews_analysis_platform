
services:
  # MongoDB service
  mongodb:
    image: mongo:latest
    container_name: reviews_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=reviews_db
    networks:
      - reviews_network


  redis:
    image: redis:7-alpine
    container_name: reviews_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - reviews_network

  # Backend API service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reviews_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
      - redis
    environment:
      - MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/reviews_db
      - REDIS_URL=redis://redis:6379/0 
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/app:/app/app 
    networks:
      - reviews_network


# Scraper: Pure Celery Worker (no API, no ports)
  scraper_worker:
    build:
      context: ./scraper
      dockerfile: Dockerfile  
    container_name: reviews_scraper_worker
    restart: always
    # NO ports - pure worker
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./scraper/app:/app/app
      - ./scraper/logs:/app/logs
    environment:
      - MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/reviews_db
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    networks:
      - reviews_network
    shm_size: '2gb'
    mem_limit: 4g
    cpus: 2.0
  
  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reviews_frontend
    restart: always
    ports:
      - "3000:3000"  # Only change the port
    depends_on:
      - backend
      
    environment:
      #- NEXT_PUBLIC_API_URL=http://backend:8000  # Keep internal container communication
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      #- /app/node_modules
      - /app/.next
    networks:
      - reviews_network

networks:
  reviews_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local