name: Deploy to Google Cloud Run

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west1 # Change to your preferred region

jobs:
  # 🔥 Test stage - Run on every push/PR
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install -r ../requirements-dev.txt

      - name: Run backend tests
        run: |
          pytest tests/api -v --tb=short

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend build test
        run: |
          cd frontend
          npm run build

      # - name: Run pre-commit checks
      #   uses: pre-commit/action@v3.0.0

  # 🔥 Security scan stage
  security-scan:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # 🔥 Build and deploy stage - Only on master branch
  deploy:
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $REGION-docker.pkg.dev

      - name: Build and push backend image
        run: |
          docker build \
            --target production \
            --tag $REGION-docker.pkg.dev/$PROJECT_ID/reviews-app/backend:$GITHUB_SHA \
            --tag $REGION-docker.pkg.dev/$PROJECT_ID/reviews-app/backend:latest \
            ./backend

          docker push $REGION-docker.pkg.dev/$PROJECT_ID/reviews-app/backend:$GITHUB_SHA
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/reviews-app/backend:latest

      - name: Build and push frontend image
        run: |
          docker build \
            --target production \
            --tag $REGION-docker.pkg.dev/$PROJECT_ID/reviews-app/frontend:$GITHUB_SHA \
            --tag $REGION-docker.pkg.dev/$PROJECT_ID/reviews-app/frontend:latest \
            ./frontend

          docker push $REGION-docker.pkg.dev/$PROJECT_ID/reviews-app/frontend:$GITHUB_SHA
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/reviews-app/frontend:latest

      - name: Build and push scraper image
        run: |
          docker build \
            --target production \
            --tag $REGION-docker.pkg.dev/$PROJECT_ID/reviews-app/scraper:$GITHUB_SHA \
            --tag $REGION-docker.pkg.dev/$PROJECT_ID/reviews-app/scraper:latest \
            ./scraper

          docker push $REGION-docker.pkg.dev/$PROJECT_ID/reviews-app/scraper:$GITHUB_SHA
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/reviews-app/scraper:latest

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy reviews-backend \
            --image $REGION-docker.pkg.dev/$PROJECT_ID/reviews-app/backend:$GITHUB_SHA \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars="MONGODB_URI=${{ secrets.MONGODB_URI }},REDIS_URL=${{ secrets.REDIS_URL }},GIMINI_API_KEY=${{ secrets.GIMINI_API_KEY }},GIMINI_MODEL_NAME=${{ secrets.GIMINI_MODEL_NAME }}" \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy reviews-frontend \
            --image $REGION-docker.pkg.dev/$PROJECT_ID/reviews-app/frontend:$GITHUB_SHA \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars="NEXT_PUBLIC_API_URL=https://reviews-backend-[HASH]-ew.a.run.app" \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5

      - name: Deploy scraper to Cloud Run Jobs
        run: |
          gcloud run jobs create reviews-scraper \
            --image $REGION-docker.pkg.dev/$PROJECT_ID/reviews-app/scraper:$GITHUB_SHA \
            --region $REGION \
            --set-env-vars="MONGODB_URI=${{ secrets.MONGODB_URI }},REDIS_URL=${{ secrets.REDIS_URL }}" \
            --memory 2Gi \
            --cpu 2 \
            --max-retries 3 \
            --parallelism 1 \
            || gcloud run jobs replace-job reviews-scraper \
            --image $REGION-docker.pkg.dev/$PROJECT_ID/reviews-app/scraper:$GITHUB_SHA \
            --region $REGION
